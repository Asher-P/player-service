apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # This is what $__rate_interval is built from - max($__interval + timeInterval,
      # 4 * timeInterval) - so it has to match how often the service actually pushes, not how often
      # Prometheus scrapes (it scrapes nothing here). Kept in step with
      # Observability:MetricExportIntervalSeconds; if that changes, change this too, or every rate()
      # panel silently reads "No data" for want of a second sample in the window.
      timeInterval: 15s
      # Turns exemplars on a latency histogram into a link straight to the trace that produced the
      # slow request - the reason both datasources are provisioned together rather than separately.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
